services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: banking
    ports:
      - "5433:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  banking-api:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
